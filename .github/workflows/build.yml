name: Build EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install customtkinter pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name EmulatorRootCertInstaller cert_installer.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmulatorRootCertInstaller
          path: dist/EmulatorRootCertInstaller.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EmulatorRootCertInstaller.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
